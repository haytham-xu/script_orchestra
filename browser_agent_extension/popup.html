<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Browser Agent</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p  { font-size: 12px; color: #4a4a4c; margin: 0 0 12px; line-height: 1.4; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: #34c759; margin-right: 6px; vertical-align: middle; }
    a.open {
      display: block; text-align: center; padding: 8px;
      background: #0071e3; color: #fff; border-radius: 6px;
      text-decoration: none; font-size: 13px; font-weight: 500;
    }
    a.open:hover { background: #0058b8; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>Browser Agent</h1>
  <p>
    Extension is running in the background. All controls now live in the web
    UI — click below.
  </p>
  <a class="open" href="http://localhost:5001/browser-agent" target="_blank">
    Open Browser Agent
  </a>
</body>
</html>
