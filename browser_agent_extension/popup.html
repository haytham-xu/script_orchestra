<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Browser Agent</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .feature {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #1d1d1f;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .feature:hover { background: #0071e3; color: #fff; }
    .feature:disabled { opacity: 0.5; cursor: default; }
    #status {
      font-size: 12px;
      color: #86868b;
      margin-top: 8px;
      min-height: 16px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Browser Agent</h1>
  <div id="features"></div>
  <div id="status"></div>

  <!-- Core first, then each feature registers itself. Add new feature
       files below to extend the popup. -->
  <script src="config.js"></script>
  <script src="features/tab_downloader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
