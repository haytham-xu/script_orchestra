[pytest]
testpaths = backend/file_git/tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = backend/file_git/tests/e2e backend
# Serial execution required — tests share filesystem state. Stop at first failure
# so cascading noise from a broken earlier test is not reported as separate failures.
addopts = -p no:randomly -x
